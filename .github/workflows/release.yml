name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -tags "webkit2_41"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: multibrowser-linux
          path: build/bin/multibrowser

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: multibrowser-windows
          path: build/bin/multibrowser.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: multibrowser-linux
          path: artifacts/linux

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: multibrowser-windows
          path: artifacts/windows

      - name: Build AppImage
        run: |
          chmod +x artifacts/linux/multibrowser
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp artifacts/linux/multibrowser AppDir/usr/bin/multibrowser
          printf "[Desktop Entry]\nName=MultiBrowser\nExec=multibrowser\nIcon=multibrowser\nType=Application\nCategories=Utility;\nTerminal=false\n" > multibrowser.desktop
          cp build/appicon.png multibrowser.png
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_STRIP=1
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable artifacts/linux/multibrowser \
            --desktop-file multibrowser.desktop \
            --icon-file multibrowser.png \
            --output appimage

      - name: Prepare Release Assets
        run: |
          mkdir -p release
          find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -exec cp {} release/MultiBrowser-linux-x86_64.AppImage \;
          cp artifacts/linux/multibrowser release/multibrowser-linux-amd64
          cp artifacts/windows/multibrowser.exe release/multibrowser-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
