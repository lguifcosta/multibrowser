name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -tags "webkit2_41"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: multibrowser-linux
          path: build/bin/multibrowser

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: multibrowser-windows
          path: build/bin/multibrowser.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: multibrowser-linux
          path: artifacts/linux

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: multibrowser-windows
          path: artifacts/windows

      - name: Build AppImage
        run: |
          chmod +x artifacts/linux/multibrowser
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp artifacts/linux/multibrowser AppDir/usr/bin/multibrowser
          printf "[Desktop Entry]\nName=MultiBrowser\nExec=multibrowser\nIcon=multibrowser\nType=Application\nCategories=Utility;\nTerminal=false\n" > multibrowser.desktop
          cp build/appicon.png multibrowser.png

          # Bundle WebKitGTK helper processes
          WEBKIT_DIR=$(dirname $(dpkg -L libwebkit2gtk-4.1-0 2>/dev/null | grep WebKitNetworkProcess) 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1")
          mkdir -p AppDir/usr/lib/webkit2gtk-4.1
          for proc in WebKitNetworkProcess WebKitWebProcess; do
            if [ -f "$WEBKIT_DIR/$proc" ]; then
              cp "$WEBKIT_DIR/$proc" AppDir/usr/lib/webkit2gtk-4.1/
            fi
          done

          # Step 1: linuxdeploy to bundle shared libraries (no --output)
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_STRIP=1
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable artifacts/linux/multibrowser \
            --desktop-file multibrowser.desktop \
            --icon-file multibrowser.png

          # Step 2: Deploy WebKit helper libraries
          for proc in AppDir/usr/lib/webkit2gtk-4.1/*; do
            [ -f "$proc" ] && ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable "$proc" 2>/dev/null || true
          done

          # Step 3: Replace AppRun symlink with custom script
          rm -f AppDir/AppRun
          printf '#!/bin/bash\nif [ -n "$APPIMAGE" ] && [ -n "$APPDIR" ]; then\n    HERE="$APPDIR"\nelse\n    HERE="$(cd "$(dirname "$0")" && pwd)"\nfi\nexport LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexport WEBKIT_EXEC_PATH="${HERE}/usr/lib/webkit2gtk-4.1"\nexec "${HERE}/usr/bin/multibrowser" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          # Step 4: Generate AppImage
          ARCH=x86_64 ./appimagetool AppDir

      - name: Prepare Release Assets
        run: |
          mkdir -p release
          find . -maxdepth 1 -name 'MultiBrowser*.AppImage' -exec cp {} release/MultiBrowser-linux-x86_64.AppImage \;
          cp artifacts/linux/multibrowser release/multibrowser-linux-amd64
          cp artifacts/windows/multibrowser.exe release/multibrowser-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
